<template id="payment-error">
    <p class="instruction-text" id="instruction-text"></p>

    <div class="summary-container">
        <div class="summary-text">
            <span>
                <p class="failed">We could not confirm your payment status.</p>
                <p>If you were charged, please contact support with the transaction ID above.</p>
            </span>
        </div>
        <a href="javascript:location.reload()">Check again</a>
        <br>
        <a href=".">Back to selection</a>
    </div>
</template>
